<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fufi</title>
<style>
:root {
  --red:#36b7ff;
  --bg:#050506;
  --text:#f6f3f4;
  --muted:#8b8589;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif}
body{background:var(--bg);color:var(--text);overflow:hidden}
#scene{
  position:fixed;inset:0;
  background:
    radial-gradient(700px 420px at 50% 42%,rgba(30,150,255,.08),transparent 68%),
    radial-gradient(420px 340px at 14% 22%,rgba(30,120,255,.045),transparent 70%),
    radial-gradient(420px 340px at 86% 74%,rgba(30,120,255,.04),transparent 70%),
    rgba(3,6,10,.18);
}
#bgVideo{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:-10;pointer-events:none;
}
#videoOverlay{
  position:fixed;inset:0;z-index:-9;pointer-events:none;
  background:rgba(3,8,14,.48);
}


.dotbg{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:rgba(54,183,255,.6);
  box-shadow:0 0 7px rgba(54,183,255,.2);
}
#cursorGlow{
  position:fixed;left:0;top:0;width:220px;height:220px;
  margin:-110px 0 0 -110px;border-radius:50%;
  pointer-events:none;z-index:2;
  background:radial-gradient(circle,rgba(54,183,255,.12),rgba(54,183,255,.035) 34%,transparent 68%);
  will-change:transform;
}
#cursorGlow{position:fixed;left:0;top:0;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,rgba(54,183,255,.22),rgba(54,183,255,.07) 35%,transparent 70%);will-change:transform}
#vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 28%,rgba(0,0,0,.76) 100%)}
main{position:relative;z-index:4;min-height:100vh;display:grid;grid-template-columns:minmax(500px,720px) minmax(360px,460px);align-items:center;justify-content:center;gap:clamp(70px,8vw,150px);padding:42px 56px;transform:scale(1.48);transform-origin:center center}
.hero{width:min(460px,100%);text-align:center;will-change:transform;transform-style:preserve-3d}
.avatar-wrap{position:relative;width:104px;height:104px;margin:0 auto 20px;will-change:transform}
.avatar{width:104px;height:104px;border-radius:50%;display:block;object-fit:cover;
  border:2px solid rgba(255,255,255,.10);
  box-shadow:0 0 0 6px rgba(54,183,255,.045),0 0 40px rgba(54,183,255,.28),0 12px 30px rgba(0,0,0,.4)}
.ring{position:absolute;inset:-10px;border:1px solid rgba(54,183,255,.28);border-radius:50%;
  animation:pulse 2.6s ease-in-out infinite}
.status-dot{position:absolute;right:2px;bottom:4px;width:12px;height:12px;border-radius:50%;
  border:2px solid #050506;background:#545054}
.status-dot.online{background:var(--red);box-shadow:0 0 13px rgba(54,183,255,.95)}
h1{font-size:30px;line-height:1;margin:0 0 22px;font-weight:800;text-shadow:0 0 20px rgba(54,183,255,.16)}
.card{contain:layout paint;width:min(330px,100%);margin:auto;padding:14px;display:flex;gap:11px;text-align:left;
  background:linear-gradient(135deg,rgba(22,18,20,.95),rgba(9,8,9,.92));
  border:1px solid rgba(54,183,255,.22);border-radius:16px;
  box-shadow:0 10px 26px rgba(0,0,0,.30);
  will-change:transform;transform-style:preserve-3d}
.icon{width:50px;height:50px;flex:none;border-radius:13px;overflow:hidden;background:#171216;
  border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;color:#767075;font-size:19px}
.icon img{width:100%;height:100%;object-fit:cover;display:block}.vcc-icon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:#20b8d7;color:#08252b;font-weight:900;font-size:18px;letter-spacing:-.08em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}.vcc-icon::after{content:"CC"}
.info{min-width:0;flex:1}
.top{display:flex;justify-content:space-between;gap:8px;font-size:9px;line-height:1}
.status{font-weight:800;letter-spacing:.09em;color:#7d767a}
.status.online{color:var(--red)}
.top-right{color:#686266;white-space:nowrap}
.title{display:block;font-size:12px;margin:6px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:#102b3b;border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#36b7ff,#62ceff);
  box-shadow:0 0 9px rgba(54,183,255,.6)}
.sub,.timer{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:#6f696d;margin-top:6px}
.timer{color:#6f696d;margin-top:3px;min-height:9px}
.connection{font-size:8px;color:#565055;margin-top:10px}
.about{width:min(330px,100%);margin:12px auto 0;padding:14px 16px;text-align:left;
background:linear-gradient(135deg,rgba(22,18,20,.86),rgba(8,7,8,.78));
border:1px solid rgba(54,183,255,.16);border-radius:15px;
box-shadow:0 12px 35px rgba(0,0,0,.25)will-change:transform}
.about-kicker{font-size:8px;letter-spacing:.13em;font-weight:800;color:var(--red);margin-bottom:7px}
.about p{margin:3px 0;color:#827b7f;font-size:9px;line-height:1.55}
.works-panel{
  contain:layout style paint;
  width:min(720px,100%);
  padding:28px;
  border:1px solid rgba(54,183,255,.23);
  border-radius:20px;
  background:
    linear-gradient(145deg,rgba(20,15,18,.90),rgba(8,7,8,.78));
  box-shadow:0 14px 34px rgba(0,0,0,.34);
  
  will-change:transform;
}
.works-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
.works-kicker{font-size:9px;letter-spacing:.16em;font-weight:800;color:var(--red);margin-bottom:6px}
.works-head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:.02em}
.works-counter{font-size:9px;color:#716a6f;letter-spacing:.08em;padding-bottom:3px}
.works-stage{position:relative;display:grid;will-change:transform;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.work-card{
  height:385px;
  border-radius:15px;
  overflow:hidden;
  border:1px solid rgba(54,183,255,.18);
  background:
    radial-gradient(circle at 50% 50%,rgba(54,183,255,.035),transparent 62%),
    #0a0809;
  display:grid;
  place-items:center;
  box-shadow:inset 0 0 24px rgba(0,0,0,.28);
  contain:paint;
}
.work-card img{width:100%;height:100%;display:block;object-fit:contain;padding:8px;opacity:1;backface-visibility:hidden;transform:translateZ(0)}

.works-arrow{
  position:absolute;z-index:3;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(54,183,255,.26);
  background:rgba(8,7,9,.88);
  color:#f3eef0;font-size:29px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.works-arrow.left{left:-20px}.works-arrow.right{right:-20px}
.works-arrow:hover{transform:translateY(-50%) scale(1.08);border-color:rgba(54,183,255,.65);background:rgba(26,10,14,.96)}
.works-dots{display:flex;justify-content:center;gap:7px;margin-top:16px}
.work-dot{width:7px;height:7px;border-radius:50%;border:1px solid rgba(54,183,255,.32);background:#102632;cursor:pointer;padding:0}
.work-dot.active{background:var(--red);box-shadow:0 0 10px rgba(54,183,255,.55)}
@keyframes pulse{0%,100%{transform:scale(.98);opacity:.55}50%{transform:scale(1.05);opacity:1}}
@media(max-width:700px){main{transform:scale(1)}} @media(max-width:520px){body{overflow:auto}}
</style>
</head>

function fmt(ms) {
  const sec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function updateTimer() {

}

const ICON_CDN = "https://cdn.jsdelivr.net/npm/simple-icons@v14/icons/";

function slugForActivity(name) {
  const normalized = String(name || "").trim().toLowerCase();
  if (ICON_ALIASES[normalized]) return ICON_ALIASES[normalized];

  // Match known entries when the Discord activity contains extra text.
  const found = Object.keys(ICON_ALIASES)
    .sort((a,b) => b.length - a.length)
    .find(k => normalized.includes(k));
  return found ? ICON_ALIASES[found] : null;
}

function setIcon(activity) {
  const assets = activity && activity.assets;
  let url = null;

  if (assets && assets.large_image) {
    const v = assets.large_image;
    if (v.startsWith("mp:")) url = "https://media.discordapp.net/" + v.slice(3);
    else if (activity.application_id) {
      url = "https://cdn.discordapp.com/app-assets/" + activity.application_id + "/" + v + ".png";
    } else if (/^https?:\/\//i.test(v)) url = v;
  }

  if (!url && assets && assets.small_image) {
    const v = assets.small_image;
    if (v.startsWith("mp:")) url = "https://media.discordapp.net/" + v.slice(3);
    else if (activity.application_id) {
      url = "https://cdn.discordapp.com/app-assets/" + activity.application_id + "/" + v + ".png";
    } else if (/^https?:\/\//i.test(v)) url = v;
  }

  const slug = slugForActivity(activity?.name);
  if (!url && slug) url = ICON_CDN + slug + ".svg";

  if (url) {
    loadImage(url, im => {
      icon.replaceChildren(im);
    }, () => {
      icon.innerHTML = "<span>▶</span>";
    });
  } else {
    icon.innerHTML = "<span>▶</span>";
  }
}

function render(p) {
  if (!p) return;
  setOnline(p.discord_status);

  if (p.listening_to_spotify && p.spotify) {
    activityStart = p.spotify.timestamps?.start || null;
    title.textContent = p.spotify.song || "Spotify";
    sub.textContent = p.spotify.artist || "Spotify";
    if (p.spotify.album_art_url) {
      loadImage(p.spotify.album_art_url, im => icon.replaceChildren(im), () => icon.innerHTML = "<span>♫</span>");
    } else icon.innerHTML = "<span>♫</span>";
    updateTimer();
    return;
  }

  const acts = Array.isArray(p.activities) ? p.activities : [];
  const a = acts.find(v => v.type !== 4) || acts[0] || null;

  if (a) {
    activityStart = a.timestamps?.start || a.created_at || null;
    title.textContent = a.name || "Активность";
    sub.textContent = a.details || a.state || (a.type === 0 ? "Играет в игру" : "Активность");
    setIcon(a);
    updateTimer();
  } else {
    activityStart = null;
    title.textContent = p.discord_status === "offline" ? "Не в сети" : "Ничего не запущено";
    sub.textContent = p.discord_status === "offline" ? "Offline" : "Онлайн";
    timer.textContent = "";
    bar.style.width = "0%";
    icon.innerHTML = "<span>●</span>";
  }
}

async function fetchPresence() {
  try {
    const r = await fetch(REST, {cache:"no-store"});
    const j = await r.json();
    if (j && j.success) render(j.data);
  } catch (_) {}
}

function connect() {
  clearTimeout(reconnect);
  if (hb) clearInterval(hb);
  try { if (ws) ws.close(); } catch (_) {}

  ws = new WebSocket(WS);

  ws.onopen = () => {
    connection.textContent = "Live • WebSocket";
  };

  ws.onmessage = e => {
    let m;
    try { m = JSON.parse(e.data); } catch (_) { return; }

    if (m.op === 1 && m.d) {
      clearInterval(hb);
      hb = setInterval(() => {
        if (ws.readyState === 1) ws.send(JSON.stringify({op:3,d:null}));
      }, m.d.heartbeat_interval);
      ws.send(JSON.stringify({op:2,d:{subscribe_to_id:ID}}));
    } else if (m.op === 0 && (m.t === "INIT_STATE" || m.t === "PRESENCE_UPDATE") && m.d) {
      render(m.d);
    }
  };

  ws.onclose = () => {
    connection.textContent = "Переподключение…";
    reconnect = setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    try { ws.close(); } catch (_) {}
  };
}

  const nx = (x / innerWidth - 0.5) * 2;

  hero.style.transform = `translate3d(${(nx * 1.8).toFixed(1)}px,${(ny * 1.8).toFixed(1)}px,0)`;
  avatarWrap.style.transform = `translate3d(${(-nx * 5).toFixed(1)}px,${(-ny * 5).toFixed(1)}px,0)`;
  card.style.transform = `translate3d(${(nx * 4).toFixed(1)}px,${(ny * 3).toFixed(1)}px,0)`;
  about.style.transform = `translate3d(${(nx * 3).toFixed(1)}px,${(ny * 2.5).toFixed(1)}px,0)`;
  cursorGlow.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;

  requestAnimationFrame(animate);
}

];
const workA = document.getElementById("workA");
const workB = document.getElementById("workB");
const worksCounter = document.getElementById("worksCounter");
const worksDots = document.getElementById("worksDots");
let workIndex = 0;

function buildWorkDots() {
  worksDots.innerHTML = "";
  workImages.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "work-dot" + (i === 0 ? " active" : "");
    b.setAttribute("aria-label", "Показать работу " + (i + 1));
    b.addEventListener("click", () => { workIndex = i; renderWorks(); });
    worksDots.appendChild(b);
  });
}

function preload(src) {
  const im = new Image();
  im.src = src;
  return im;
}

function renderWorks() {
  const a = workIndex;
  const b = (workIndex + 1) % workImages.length;
  workA.style.opacity = "0.18";
  workB.style.opacity = "0.18";

  setTimeout(() => {
    workA.src = workImages[a];
    workB.src = workImages[b];
    workA.alt = "Пример работы " + (a + 1);
    workB.alt = "Пример работы " + (b + 1);
    worksCounter.textContent =
      String(a + 1).padStart(2,"0") + " / " + String(workImages.length).padStart(2,"0");
    workA.onload = () => workA.style.opacity = "1";
    workB.onload = () => workB.style.opacity = "1";
    [...worksDots.children].forEach((d,i)=>d.classList.toggle("active",i===a));
  }, 90);
}

document.getElementById("worksPrev").addEventListener("click", () => {
  workIndex = (workIndex - 1 + workImages.length) % workImages.length;
  renderWorks();
});
document.getElementById("worksNext").addEventListener("click", () => {
  workIndex = (workIndex + 1) % workImages.length;
  renderWorks();
});
buildWorkDots();
workImages.forEach(preload);
renderWorks();

</script>
</body>
</html>
